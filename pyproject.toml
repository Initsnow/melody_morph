[project]
name = "melody-morph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mido>=1.3.3",
    "utaupy>=1.22.1",
]

[project.scripts]
gp-chords = "gpchords.annotate:main"
gp-info = "gpchords.info:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpchords"]

[dependency-groups]
dev = ["pytest>=8.0"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
